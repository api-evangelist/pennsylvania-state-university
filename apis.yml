x-coverage:
  state: covered
  reason: covered
  detail: >-
    Penn State operates five machine-readable surfaces of its own and we hold contracts or probed
    evidence for all five. Two carry genuine first-party OpenAPI documents the university wrote
    itself (Researcher Metadata Database, ScholarSphere); one is an open OAI-PMH 2.0 provider over
    the ETD archive; one is an unauthenticated facilities API from the Office of Physical Plant
    whose description in this repo is ours, reconstructed from HTML docs and live responses; one is
    the university's own Shibboleth IdP published as SAML metadata in InCommon. No vendor contract
    is attributed to Penn State in this repo and no tenant relationship was found — ScholarSphere is
    self-built rather than a Figshare or Dataverse tenancy, which is unusual for this cohort. The
    one real loss since the June 2026 profile is central IT's developer portal at
    docs.developer.psu.edu, which brokered internal REST services (PSU ID, Academic Course,
    Cornerstone, Sponsored Accounts, ASR Lookup) behind WebAccess and now 302s to sites.psu.edu; the
    entry and its pointers have been removed rather than left standing as a dead claim. What remains
    unreadable is by design: everything behind Shibboleth. Penn State also authors, but does not
    publicly host, a SCIM 2.0 server implementation.
