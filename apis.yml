- aid: pennsylvania-state-university:etda-oai-pmh
  name: ETDA OAI-PMH Provider
  x-operator: institution
  description: >-
    An open OAI-PMH 2.0 harvesting endpoint over Penn State's Electronic Theses and Dissertations Archive,
    served by the Libraries' own etda_explore application on a psu.edu host. Identify reports repositoryName
    Penn_State_University, adminEmail askalibrarian@psu.edu and an earliest datestamp of 1999-04-07; oai_dc
    is the supported metadata format and the repository declares no set hierarchy. No credential, no registration
    — the one Penn State surface an outside machine can harvest today without asking anyone.
  humanURL: https://etda.libraries.psu.edu/
