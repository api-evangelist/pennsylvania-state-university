aid: pennsylvania-state-university
name: Pennsylvania State University
x-type: university
x-category: Public Research University
description: >-
  Pennsylvania State University (Penn State) is a public, land-grant research university with its
  primary campus at University Park, PA, and is ranked #69 in the QS World University Rankings 2025.
  Its programmable footprint is real but narrow, and it lives almost entirely in University
  Libraries rather than in central IT. Penn State publishes two genuine first-party OpenAPI
  descriptions of services it builds and operates itself: the Researcher Metadata Database (RMD), the
  authority on faculty and research metadata, and ScholarSphere, its self-built institutional
  repository — both key-gated, both described in OpenAPI 3.0 by the Libraries team that wrote them.
  Alongside those it runs an open OAI-PMH 2.0 provider over the Electronic Theses and Dissertations
  Archive, an unauthenticated facilities API from the Office of Physical Plant (LionSpaceFIS), and
  its own Shibboleth identity provider registered in InCommon. Penn State also authors open-source
  identity software, including a SCIM 2.0 server implementation. What it no longer has is a central
  developer portal: docs.developer.psu.edu, which catalogued internal REST services such as PSU ID,
  Academic Course and Cornerstone behind WebAccess single sign-on, now redirects to sites.psu.edu and
  has been decommissioned. There is no unified API gateway, no shared credential, and no
  self-service onboarding — each surface issues its own key out of the unit that operates it.
